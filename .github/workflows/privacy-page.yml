name: Publish privacy policy

on:
  push:
    branches:
      - main
    paths:
      - privacy/index.html
      - .github/workflows/privacy-page.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout the published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: true

      - name: Copy the page from main
        run: cp privacy/index.html site/index.html

      - name: Publish when the page changed
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No privacy policy changes to publish."
            exit 0
          fi
          git commit -m "Publish the privacy policy from main."
          git push origin HEAD:gh-pages
