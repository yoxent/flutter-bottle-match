name: Publish privacy policy

on:
  push:
    branches:
      - main
    paths:
      - privacy/index.html
      - .github/workflows/privacy-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish privacy policy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Upload the privacy page
        uses: actions/upload-pages-artifact@v3
        with:
          path: privacy

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
