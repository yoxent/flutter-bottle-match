name: flutter_bottle_match
description: Colorful Bottle Match, a local shared-device party puzzle.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Forui 0.26+ requires Flutter 3.47 and Dart 3.13. This project stays on
  # the installed Flutter 3.44 / Dart 3.12 toolchain, so Forui is pinned.
  forui: 0.25.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/bottles/
    - assets/images/racks/
